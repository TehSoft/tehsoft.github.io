<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehsoft - Bejelentkezés</title>
    <link rel="stylesheet" href="../style.css"> 
    <style>
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 350px;
            margin: 40px auto;
            text-align: center;
        }
        input {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #0052a3; }
        .logout-btn { background-color: #dc3545; margin-top: 15px; }
        .logout-btn:hover { background-color: #bd2130; }
        .admin-panel {
            display: none;
            background: #e8f5e9;
        }
    </style>
</head>
<body>
    <div class="login-box" id="loginFormSzekcio">
        <h2>Rendszer Belépés</h2>
        <p>Kérlek, add meg a hozzáférési kódodat.</p>
        
        <input type="password" id="kodInput" placeholder="Titkos kód">
        <br>
        <button onclick="bejelentkezes()">Belépés</button>
    </div>

    <div class="login-box admin-panel" id="adminPanel">
        <h2>🔒 Vezérlőpult</h2>
        <p>Sikeres azonosítás! Üdvözlünk a rendszerben: <strong id="aktivUser"></strong></p>
        <p>Itt érhetőek el a pluszfunkciók.</p>
        <br>
        <a href="/" style="color: #0066cc; text-decoration: none; font-weight: bold;">Vissza a főoldalra</a>
        <br><br>
        <a href="https://github.com/tehsoft" target="_blank" style="color: #24292e; text-decoration: none; font-weight: bold;">🐱 Megnyitás a GitHubon</a>
        <br><br>
        <button onclick="kijelentkezes()" class="logout-btn">Kijelentkezés</button>
    </div>
    <script src="script.js"></script>

</body>
</html>
